<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Calculator</title>
</head>
<body>
    <div class="calculator">
        <div class="input"><input type="text" value="0"></div>

        <div class="buttons">
            <div class="column">
                <button class="special"><-</button>
                <button class="normal">7</button>
                <button class="normal">4</button>
                <button class="normal">1</button>
                <button class="normal" id="change">+/-</button>
            </div>
            <div class="column">
                <button class="special">AC</button>
                <button class="normal">8</button>
                <button class="normal">5</button>
                <button class="normal">2</button>
                <button class="normal">0</button>
            </div>
            <div class="column">
                <button class="special">%</button>
                <button class="normal">9</button>
                <button class="normal">6</button>
                <button class="normal">3</button>
                <button class="normal">.</button>
            </div>
            <div class="column">
                <button class="operator">/</button>
                <button class="operator">x</button>
                <button class="operator">-</button>
                <button class="operator">+</button>
                <button class="operator" id="equal">=</button>
            </div>
    </div>

    </div>
</body>
</html>
